name: bitmesh
description: >-
  Dart and Flutter SDK for the Bitmesh AI API: chat with streaming, images,
  video, transcription, tools and the provider proxy, with App Check support.
version: 1.1.0
homepage: https://bitmesh.ai
repository: https://github.com/bitmeshai/bitmesh-flutter-sdk
issue_tracker: https://github.com/bitmeshai/bitmesh-flutter-sdk/issues
documentation: https://bitmesh.ai/docs

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.0
  http_parser: ^4.0.2
  meta: ^1.11.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
