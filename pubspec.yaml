name: bitmesh_flutter_sdk
description: >-
  Dart & Flutter SDK for the Bitmesh AI API v2. Chat completions with
  streaming, image and video generation, audio transcription, tools and the
  provider proxy, with typed models, retries, App Check and job polling.
version: 1.0.0
homepage: https://bitmesh.ai
repository: https://github.com/bitmeshai/bitmesh-flutter-sdk
issue_tracker: https://github.com/bitmeshai/bitmesh-flutter-sdk/issues
documentation: https://bitmesh.ai/docs

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.0
  http_parser: ^4.0.2
  meta: ^1.11.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
